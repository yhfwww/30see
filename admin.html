<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30see - 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
--primary-blue: #0066cc;
--primary-blue-light: #0099ff;
--primary-orange: #ff6600;
--primary-orange-light: #ff9933;
--dark: #1a1a2e;
--light: #f8f9fa;
--white: #ffffff;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg, var(--light) 0%, #e9ecef 100%);
min-height: 100vh;
}
.login-container {
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 20px;
}
.login-box {
background: var(--white);
padding: 50px;
border-radius: 20px;
box-shadow: 0 20px 60px rgba(0, 102, 204, 0.15);
max-width: 400px;
width: 100%;
text-align: center;
}
.login-logo {
max-width: 150px;
margin-bottom: 30px;
}
.login-title {
font-family: 'Playfair Display', serif;
font-size: 2rem;
color: var(--primary-blue);
margin-bottom: 10px;
}
.login-subtitle {
color: #6c757d;
margin-bottom: 30px;
font-size: 0.95rem;
}
.login-input {
width: 100%;
padding: 15px 20px;
border: 2px solid #e9ecef;
border-radius: 10px;
font-size: 1rem;
margin-bottom: 20px;
transition: all 0.3s ease;
font-family: 'Poppins', sans-serif;
}
.login-input:focus {
outline: none;
border-color: var(--primary-blue);
box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
}
.login-btn {
width: 100%;
padding: 15px;
background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
color: var(--white);
border: none;
border-radius: 10px;
font-size: 1.1rem;
font-weight: 600;
cursor: pointer;
transition: all 0.3s ease;
font-family: 'Poppins', sans-serif;
}
.login-btn:hover {
transform: translateY(-2px);
box-shadow: 0 10px 30px rgba(0, 102, 204, 0.3);
}
.login-error {
color: #dc3545;
margin-top: 15px;
font-size: 0.9rem;
display: none;
}
.dashboard {
display: none;
padding: 40px 20px;
max-width: 800px;
margin: 0 auto;
}
.dashboard-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 40px;
flex-wrap: wrap;
gap: 20px;
}
.dashboard-title {
font-family: 'Playfair Display', serif;
font-size: 2.5rem;
background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-orange) 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}
.logout-btn {
padding: 12px 24px;
background: var(--dark);
color: var(--white);
border: none;
border-radius: 8px;
cursor: pointer;
transition: all 0.3s ease;
font-family: 'Poppins', sans-serif;
}
.logout-btn:hover {
background: #2d2d4a;
}
.stats-card {
background: var(--white);
padding: 60px;
border-radius: 20px;
box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
text-align: center;
margin-bottom: 30px;
}
.stats-icon {
font-size: 5rem;
margin-bottom: 20px;
}
.stats-value {
font-size: 5rem;
font-weight: 700;
color: var(--primary-blue);
margin-bottom: 10px;
}
.stats-label {
color: #6c757d;
font-size: 1.2rem;
}
.stats-info {
background: var(--light);
padding: 20px;
border-radius: 10px;
margin-top: 20px;
font-size: 0.9rem;
color: #6c757d;
}
.back-home {
display: inline-block;
margin-top: 30px;
padding: 12px 24px;
background: linear-gradient(135deg, var(--primary-orange), var(--primary-orange-light));
color: var(--white);
text-decoration: none;
border-radius: 8px;
transition: all 0.3s ease;
}
.back-home:hover {
transform: translateY(-2px);
box-shadow: 0 10px 30px rgba(255, 102, 0, 0.3);
}
.loading {
text-align: center;
padding: 50px;
color: #6c757d;
}
.loading-spinner {
font-size: 3rem;
animation: spin 1s linear infinite;
}
@keyframes spin {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}
@media (max-width: 768px) {
.login-box {
padding: 30px;
}
.login-title {
font-size: 1.5rem;
}
.dashboard-title {
font-size: 1.8rem;
}
.stats-value {
font-size: 3.5rem;
}
.stats-card {
padding: 40px 20px;
}
}
</style>
</head>
<body>
<div class="login-container" id="loginContainer">
<div class="login-box">
<img src="images/logo.png" alt="30see Logo" class="login-logo">
<h1 class="login-title">管理后台</h1>
<p class="login-subtitle">请输入管理员密码访问</p>
<input type="password" class="login-input" id="passwordInput" placeholder="请输入密码">
<button class="login-btn" onclick="checkPassword()">登 录</button>
<p class="login-error" id="loginError">密码错误，请重试</p>
</div>
</div>

<div class="dashboard" id="dashboard">
<div class="dashboard-header">
<h1 class="dashboard-title">访问统计</h1>
<button class="logout-btn" onclick="logout()">退出登录</button>
</div>

<div class="loading" id="loading">
<div class="loading-spinner">⏳</div>
<p>正在加载数据...</p>
</div>

<div id="statsContent" style="display: none;">
<div class="stats-card">
<div class="stats-icon">👁️</div>
<div class="stats-value" id="totalVisits">-</div>
<div class="stats-label">网站总访问量</div>
<div class="stats-info">
数据来源：CounterAPI 统计服务<br>
统计基于网站域名，而非单个页面
</div>
</div>

<a href="index.html" class="back-home">🏠 返回首页</a>
</div>
</div>

<script>
const ADMIN_PASSWORD_HASH = 'ab31b1c8809d0129331079edc9438293';

function md5Password(password) {
    let hash;
    try {
        hash = md5(password);
    } catch (e) {
        hash = password;
    }
    return hash;
}

function checkPassword() {
    const password = document.getElementById('passwordInput').value;
    const errorEl = document.getElementById('loginError');

    if (md5Password(password) === ADMIN_PASSWORD_HASH) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        showDashboard();
    } else {
        errorEl.style.display = 'block';
        document.getElementById('passwordInput').value = '';
    }
}

function logout() {
    sessionStorage.removeItem('adminLoggedIn');
    document.getElementById('loginContainer').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginError').style.display = 'none';
}

function showDashboard() {
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadStats();
}

async function loadStats() {
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('statsContent');

    try {
        const response = await fetch('https://api.counterapi.dev/v2/30seeweb/30see/stats');
        const result = await response.json();
        const data = result.data || {};

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

        document.getElementById('totalVisits').textContent = data.up_count ? data.up_count.toLocaleString() : '暂无数据';
    } catch (error) {
        console.error('获取统计失败:', error);
        loadingEl.innerHTML = '<p style="color: #dc3545;">加载失败，请刷新重试</p>';
    }
}

document.getElementById('passwordInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkPassword();
    }
});

if (sessionStorage.getItem('adminLoggedIn') === 'true') {
    showDashboard();
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
</body>
</html>
