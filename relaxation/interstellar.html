<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际穿越</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 48px;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.8),
                         0 0 40px rgba(100, 200, 255, 0.5),
                         0 0 60px rgba(100, 200, 255, 0.3);
            opacity: 0;
            animation: fadeIn 3s ease-out 1s forwards;
            pointer-events: none;
            z-index: 10;
        }

        .subtitle {
            position: fixed;
            top: calc(50% + 60px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(100, 200, 255, 0.7);
            font-family: 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 4px;
            opacity: 0;
            animation: fadeIn 3s ease-out 2s forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="title">INTERSTELLAR</div>
    <div class="subtitle">穿越星际 · WARP SPEED</div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let speed = 2;
        let warpSpeed = 0;
        const maxSpeed = 15;
        const acceleration = 0.02;

        class Star {
            constructor() {
                this.reset();
                this.z = Math.random() * 1000;
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = 1000;
                this.prevZ = this.z;
            }

            update() {
                this.prevZ = this.z;
                this.z -= warpSpeed;

                if (this.z <= 0) {
                    this.reset();
                }

                const factor = 1000 / this.z;
                const px = this.x * factor;
                const py = this.y * factor;

                const prevX = this.x * (1000 / this.prevZ);
                const prevY = this.y * (1000 / this.prevZ);

                const size = Math.max(0.5, (1000 / this.z) * 1.5);
                const brightness = Math.min(1, Math.max(0.1, (1000 - this.z) / 1000));

                const hue = 200 + (1 - brightness) * 60;
                const saturation = 50 + brightness * 50;
                const lightness = 50 + brightness * 30;

                ctx.beginPath();
                ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${brightness})`;
                ctx.lineWidth = size;

                if (warpSpeed > 2) {
                    ctx.moveTo(prevX + width / 2, prevY + height / 2);
                    ctx.lineTo(px + width / 2, py + height / 2);
                } else {
                    ctx.arc(px + width / 2, py + height / 2, size, 0, Math.PI * 2);
                }

                ctx.stroke();

                if (this.z < 100) {
                    const glow = ctx.createRadialGradient(
                        px + width / 2, py + height / 2, 0,
                        px + width / 2, py + height / 2, size * 3
                    );
                    glow.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness + 20}%, ${brightness * 0.5})`);
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(px + width / 2, py + height / 2, size * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function init() {
            resize();
            stars = [];
            const starCount = Math.min(800, Math.floor((width * height) / 5000));
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            warpSpeed = Math.min(maxSpeed, warpSpeed + acceleration);

            for (let star of stars) {
                star.update();
            }

            if (Math.random() < 0.1) {
                const centerX = width / 2;
                const centerY = height / 2;
                const angle = Math.random() * Math.PI * 2;
                const distance = 20 + Math.random() * 100;
                const flashX = centerX + Math.cos(angle) * distance;
                const flashY = centerY + Math.sin(angle) * distance;
                const flash = ctx.createRadialGradient(flashX, flashY, 0, flashX, flashY, 30);
                flash.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                flash.addColorStop(1, 'transparent');
                ctx.fillStyle = flash;
                ctx.beginPath();
                ctx.arc(flashX, flashY, 30, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            init();
        });

        canvas.addEventListener('click', () => {
            warpSpeed = 2;
        });

        init();
        animate();
    </script>
</body>
</html>
