<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何图形动画生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        input[type="range"] {
            width: 120px;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .value-display {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        #canvas {
            border: 2px solid #ddd;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 10px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            #canvas {
                max-width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 几何图形动画生成器</h1>
        
        <div class="controls">
            <button id="startBtn">开始动画</button>
            <button id="pauseBtn">暂停动画</button>
            <button id="clearBtn">清空画布</button>
            <button id="addShapeBtn">添加图形</button>
            <button onclick="window.location.href='../relaxation.html'">返回放松效果</button>
            <button onclick="window.location.href='../index.html'">返回首页</button>
            
            <div class="control-group">
                <label>动画速度</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
                    <span class="value-display" id="speedValue">1.0</span>
                </div>
            </div>
            
            <div class="control-group">
                <label>图形大小</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="sizeSlider" min="10" max="100" step="5" value="30">
                    <span class="value-display" id="sizeValue">30</span>
                </div>
            </div>
        </div>
        
        <canvas id="canvas" width="800" height="500"></canvas>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">图形数量</div>
                <div class="stat-value" id="shapeCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">动画帧率</div>
                <div class="stat-value" id="fps">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">运行时间</div>
                <div class="stat-value" id="runtime">0s</div>
            </div>
        </div>
    </div>

    <script>
        class Shape {
            constructor(x, y, size, color, type) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.type = type;
                this.rotation = 0;
                this.velocityX = (Math.random() - 0.5) * 2;
                this.velocityY = (Math.random() - 0.5) * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.opacity = 1;
                this.scale = 1;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update(canvas, speedMultiplier) {
                this.x += this.velocityX * speedMultiplier;
                this.y += this.velocityY * speedMultiplier;
                this.rotation += this.rotationSpeed * speedMultiplier;
                this.pulsePhase += 0.05 * speedMultiplier;
                this.scale = 1 + Math.sin(this.pulsePhase) * 0.1;

                // 边界碰撞检测
                if (this.x - this.size < 0 || this.x + this.size > canvas.width) {
                    this.velocityX *= -1;
                    this.x = Math.max(this.size, Math.min(canvas.width - this.size, this.x));
                }
                if (this.y - this.size < 0 || this.y + this.size > canvas.height) {
                    this.velocityY *= -1;
                    this.y = Math.max(this.size, Math.min(canvas.height - this.size, this.y));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = this.opacity;

                switch (this.type) {
                    case 'circle':
                        this.drawCircle(ctx);
                        break;
                    case 'square':
                        this.drawSquare(ctx);
                        break;
                    case 'triangle':
                        this.drawTriangle(ctx);
                        break;
                    case 'pentagon':
                        this.drawPentagon(ctx);
                        break;
                    case 'hexagon':
                        this.drawHexagon(ctx);
                        break;
                    case 'star':
                        this.drawStar(ctx);
                        break;
                    case 'heart':
                        this.drawHeart(ctx);
                        break;
                }

                ctx.restore();
            }

            drawCircle(ctx) {
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            drawSquare(ctx) {
                const half = this.size;
                ctx.fillRect(-half, -half, half * 2, half * 2);
                ctx.strokeRect(-half, -half, half * 2, half * 2);
            }

            drawTriangle(ctx) {
                ctx.beginPath();
                const height = this.size * Math.sqrt(3) / 2;
                ctx.moveTo(0, -height * 2/3);
                ctx.lineTo(-this.size, height * 1/3);
                ctx.lineTo(this.size, height * 1/3);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            drawPentagon(ctx) {
                this.drawPolygon(ctx, 5);
            }

            drawHexagon(ctx) {
                this.drawPolygon(ctx, 6);
            }

            drawPolygon(ctx, sides) {
                ctx.beginPath();
                for (let i = 0; i < sides; i++) {
                    const angle = (i * 2 * Math.PI) / sides - Math.PI / 2;
                    const x = this.size * Math.cos(angle);
                    const y = this.size * Math.sin(angle);
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            drawStar(ctx) {
                ctx.beginPath();
                const spikes = 5;
                const outerRadius = this.size;
                const innerRadius = this.size / 2;
                
                for (let i = 0; i < spikes * 2; i++) {
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const angle = (i * Math.PI) / spikes - Math.PI / 2;
                    const x = radius * Math.cos(angle);
                    const y = radius * Math.sin(angle);
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            drawHeart(ctx) {
                const size = this.size;
                ctx.beginPath();
                ctx.moveTo(0, size * 0.3);
                ctx.bezierCurveTo(-size * 0.5, -size * 0.3, -size, -size * 0.3, -size, -size * 0.1);
                ctx.bezierCurveTo(-size, -size * 0.5, -size * 0.5, -size * 0.7, 0, -size * 0.3);
                ctx.bezierCurveTo(size * 0.5, -size * 0.7, size, -size * 0.5, size, -size * 0.1);
                ctx.bezierCurveTo(size, -size * 0.3, size * 0.5, -size * 0.3, 0, size * 0.3);
                ctx.fill();
                ctx.stroke();
            }
        }

        class GeometryAnimation {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.shapes = [];
                this.isAnimating = false;
                this.animationId = null;
                this.speedMultiplier = 1;
                this.defaultSize = 30;
                this.startTime = Date.now();
                this.frameCount = 0;
                this.lastFpsUpdate = Date.now();
                this.fps = 0;
                
                this.shapeTypes = ['circle', 'square', 'triangle', 'pentagon', 'hexagon', 'star', 'heart'];
                
                this.setupEventListeners();
                this.resizeCanvas();
            }

            setupEventListeners() {
                document.getElementById('startBtn').addEventListener('click', () => this.start());
                document.getElementById('pauseBtn').addEventListener('click', () => this.pause());
                document.getElementById('clearBtn').addEventListener('click', () => this.clear());
                document.getElementById('addShapeBtn').addEventListener('click', () => this.addRandomShape());
                
                document.getElementById('speedSlider').addEventListener('input', (e) => {
                    this.speedMultiplier = parseFloat(e.target.value);
                    document.getElementById('speedValue').textContent = this.speedMultiplier.toFixed(1);
                });
                
                document.getElementById('sizeSlider').addEventListener('input', (e) => {
                    this.defaultSize = parseInt(e.target.value);
                    document.getElementById('sizeValue').textContent = this.defaultSize;
                });
                
                window.addEventListener('resize', () => this.resizeCanvas());
                
                // 点击画布添加图形
                this.canvas.addEventListener('click', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    this.addShapeAt(x, y);
                });
            }

            resizeCanvas() {
                const container = this.canvas.parentElement;
                const maxWidth = container.clientWidth - 40;
                if (window.innerWidth <= 768) {
                    this.canvas.width = Math.min(maxWidth, 800);
                    this.canvas.height = 400;
                }
            }

            generateRandomColor() {
                const colors = [
                    '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
                    '#FD79A8', '#A29BFE', '#74B9FF', '#55A3FF', '#FD79A8',
                    '#FDCB6E', '#6C5CE7', '#00B894', '#E17055', '#0984E3'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            addRandomShape() {
                const x = Math.random() * this.canvas.width;
                const y = Math.random() * this.canvas.height;
                this.addShapeAt(x, y);
            }

            addShapeAt(x, y) {
                const type = this.shapeTypes[Math.floor(Math.random() * this.shapeTypes.length)];
                const color = this.generateRandomColor();
                const size = this.defaultSize + (Math.random() - 0.5) * 20;
                
                const shape = new Shape(x, y, size, color, type);
                this.shapes.push(shape);
                this.updateStats();
            }

            start() {
                if (!this.isAnimating) {
                    this.isAnimating = true;
                    this.startTime = Date.now();
                    this.animate();
                }
            }

            pause() {
                this.isAnimating = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }

            clear() {
                this.shapes = [];
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.updateStats();
            }

            animate() {
                if (!this.isAnimating) return;
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 更新和绘制所有图形
                this.shapes.forEach(shape => {
                    shape.update(this.canvas, this.speedMultiplier);
                    shape.draw(this.ctx);
                });
                
                this.updateStats();
                this.animationId = requestAnimationFrame(() => this.animate());
            }

            updateStats() {
                // 更新图形数量
                document.getElementById('shapeCount').textContent = this.shapes.length;
                
                // 更新FPS
                this.frameCount++;
                const now = Date.now();
                if (now - this.lastFpsUpdate >= 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastFpsUpdate = now;
                    document.getElementById('fps').textContent = this.fps;
                }
                
                // 更新运行时间
                if (this.isAnimating) {
                    const runtime = Math.floor((now - this.startTime) / 1000);
                    document.getElementById('runtime').textContent = `${runtime}s`;
                }
            }
        }

        // 初始化应用
        const app = new GeometryAnimation();
        
        // 添加一些初始图形
        for (let i = 0; i < 5; i++) {
            app.addRandomShape();
        }
    </script>
</body>
</html>
