<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30see - 放松效果</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="js/stats.js"></script>
<style>
:root {
--primary-blue: #0066cc;
--primary-blue-light: #0099ff;
--primary-orange: #ff6600;
--primary-orange-light: #ff9933;
--accent-purple: #6a0dad;
--accent-red: #ff3333;
--dark: #1a1a2e;
--light: #f8f9fa;
--white: #ffffff;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg, var(--light) 0%, #e9ecef 100%);
color: var(--dark);
line-height: 1.6;
overflow-x: hidden;
}
.hero {
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 40px 20px;
position: relative;
overflow: hidden;
}
.hero::before {
content: '';
position: absolute;
top: -50%;
left: -50%;
width: 200%;
height: 200%;
background: radial-gradient(circle, rgba(0, 102, 204, 0.1) 0%, transparent 70%);
animation: pulse 8s ease-in-out infinite;
z-index: 0;
}
@keyframes pulse {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.1); }
}
.logo-container {
position: relative;
z-index: 1;
margin-bottom: 40px;
animation: fadeInDown 1s ease-out;
}
.logo {
max-width: 300px;
width: 100%;
height: auto;
filter: drop-shadow(0 10px 30px rgba(0, 102, 204, 0.2));
}
@keyframes fadeInDown {
from {
opacity: 0;
transform: translateY(-40px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
.tagline {
font-family: 'Playfair Display', serif;
font-size: 2.8rem;
font-weight: 700;
background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-orange) 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
margin-bottom: 20px;
position: relative;
z-index: 1;
animation: fadeInUp 1s ease-out 0.2s both;
}
@keyframes fadeInUp {
from {
opacity: 0;
transform: translateY(40px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
.description {
font-size: 1.2rem;
color: #495057;
max-width: 600px;
margin-bottom: 60px;
position: relative;
z-index: 1;
animation: fadeInUp 1s ease-out 0.4s both;
}
.effects-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 25px;
max-width: 1000px;
width: 100%;
position: relative;
z-index: 1;
animation: fadeInUp 1s ease-out 0.6s both;
}
.effect-card {
background: linear-gradient(135deg, var(--light) 0%, var(--white) 100%);
padding: 30px;
border-radius: 15px;
text-align: center;
border: 2px solid transparent;
transition: all 0.3s ease;
position: relative;
overflow: hidden;
}
.effect-card::before {
content: '';
position: absolute;
top: 0;
left: 0;
right: 0;
height: 4px;
background: linear-gradient(90deg, var(--primary-blue), var(--primary-orange));
}
.effect-card:hover {
transform: translateY(-8px);
box-shadow: 0 15px 40px rgba(0, 102, 204, 0.15);
border-color: var(--primary-blue);
}
.effect-icon {
font-size: 3rem;
margin-bottom: 15px;
}
.effect-title {
font-size: 1.3rem;
font-weight: 700;
color: var(--primary-blue);
margin-bottom: 10px;
}
.effect-btn {
padding: 12px 24px;
font-size: 1rem;
font-weight: 600;
background: linear-gradient(135deg, var(--primary-orange), var(--primary-orange-light));
color: var(--white);
border: none;
border-radius: 30px;
cursor: pointer;
text-decoration: none;
display: inline-block;
transition: all 0.3s ease;
}
.effect-btn:hover {
transform: translateY(-3px);
box-shadow: 0 10px 30px rgba(255, 102, 0, 0.3);
}
.back-btn {
margin-top: 60px;
padding: 14px 30px;
font-size: 1.1rem;
font-weight: 600;
background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
color: var(--white);
border: none;
border-radius: 50px;
cursor: pointer;
text-decoration: none;
display: inline-block;
transition: all 0.3s ease;
position: relative;
z-index: 1;
animation: fadeInUp 1s ease-out 0.8s both;
}
.back-btn:hover {
transform: translateY(-4px);
box-shadow: 0 15px 40px rgba(0, 102, 204, 0.3);
}
@media (max-width: 768px) {
.tagline {
font-size: 2.2rem;
}
.description {
font-size: 1.1rem;
}
.effects-grid {
grid-template-columns: 1fr;
}
}
</style>
</head>
<body>
<section class="hero">
<div class="logo-container">
<img src="images/logo.png" alt="30see Logo" class="logo">
</div>
<h1 class="tagline">放松效果</h1>
<p class="description">
探索各种视觉放松效果，帮助你缓解压力，放松心情，进入宁静的状态。
</p>
<div class="effects-grid">
<div class="effect-card">
<div class="effect-icon">🫧</div>
<h3 class="effect-title">气泡效果</h3>
<a href="relaxation/bubble_page.html" class="effect-btn">查看效果</a>
</div>
<div class="effect-card">
<div class="effect-icon">🎆</div>
<h3 class="effect-title">烟花效果</h3>
<a href="relaxation/fireworks.html" class="effect-btn">查看效果</a>
</div>
<div class="effect-card">
<div class="effect-icon">🔷</div>
<h3 class="effect-title">几何动画</h3>
<a href="relaxation/geometry-animation.html" class="effect-btn">查看效果</a>
</div>
<div class="effect-card">
<div class="effect-icon">🌌</div>
<h3 class="effect-title">星际效果</h3>
<a href="relaxation/interstellar.html" class="effect-btn">查看效果</a>
</div>
<div class="effect-card">
<div class="effect-icon">🌧️</div>
<h3 class="effect-title">雨滴效果</h3>
<a href="relaxation/rain.html" class="effect-btn">查看效果</a>
</div>
<div class="effect-card">
<div class="effect-icon">🌸</div>
<h3 class="effect-title">樱花效果</h3>
<a href="relaxation/sakura.html" class="effect-btn">查看效果</a>
</div>
</div>
<a href="index.html" class="back-btn">
🏠 返回首页
</a>
</section>

<script>
if (typeof StatsAPI !== 'undefined') {
    StatsAPI.incrementVisit('relaxation');
}
</script>
</body>
</html>
